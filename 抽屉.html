<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽屉</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1510;
  --surface: #221c14;
  --surface2: #2a2318;
  --border: #3a3020;
  --border2: #4a3e28;
  --accent: #e8b86d;
  --accent2: #c47a3a;
  --accent3: #8fba6e;
  --text: #f0e8d8;
  --text2: #c8b89a;
  --muted: #7a6a50;
  --muted2: #5a4e38;
  --danger: #c47a6a;
  --glow: rgba(232, 184, 109, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
  opacity: 0.6;
}

/* Layout */
.app {
  display: flex;
  width: 100%;
  height: 100vh;
}

/* === LEFT PANEL - Chat === */
.chat-panel {
  width: 52%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  position: relative;
}

/* Header */
.chat-header {
  padding: 28px 36px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-shrink: 0;
}

.app-name {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.chat-title {
  font-family: 'Crimson Pro', serif;
  font-size: 26px;
  font-weight: 300;
  color: var(--text);
  letter-spacing: 0.02em;
}

.chat-title span { color: var(--accent); }

.push-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--muted);
  padding: 8px 16px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.3s;
  text-transform: uppercase;
}

.push-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.push-btn.active {
  border-color: var(--accent3);
  color: var(--accent3);
}

.push-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.message {
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: fadeUp 0.4s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { align-items: flex-end; }
.message.ai { align-items: flex-start; }

.msg-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--muted2);
  text-transform: uppercase;
}

.msg-bubble {
  max-width: 85%;
  padding: 14px 18px;
  line-height: 1.75;
  font-size: 15px;
  font-weight: 300;
}

.message.user .msg-bubble {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  border-radius: 2px 2px 0 2px;
}

.message.ai .msg-bubble {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  color: var(--text);
  border-radius: 0 2px 2px 2px;
}

.message.ai .msg-bubble strong {
  color: var(--accent);
  font-weight: 500;
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  width: fit-content;
}

.typing-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: typingBounce 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Save to drawer button */
.save-prompt {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}

.save-to-drawer {
  background: none;
  border: 1px solid var(--accent2);
  color: var(--accent2);
  padding: 6px 14px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.25s;
  text-transform: uppercase;
}

.save-to-drawer:hover {
  background: var(--accent2);
  color: var(--bg);
}

.save-to-drawer:disabled {
  opacity: 0.4;
  cursor: default;
}

/* Input */
.chat-input-area {
  padding: 20px 36px 28px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}

.input-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.chat-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 1.6;
  padding: 14px 18px;
  resize: none;
  outline: none;
  min-height: 52px;
  max-height: 160px;
  transition: border-color 0.3s;
}

.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--muted2); }

.send-btn {
  background: var(--accent);
  border: none;
  color: var(--bg);
  width: 52px;
  height: 52px;
  cursor: pointer;
  font-size: 18px;
  transition: opacity 0.2s, transform 0.2s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.send-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.send-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

.input-hint {
  margin-top: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  letter-spacing: 0.1em;
}

/* === RIGHT PANEL - Drawer === */
.drawer-panel {
  width: 48%;
  display: flex;
  flex-direction: column;
}

.drawer-header {
  padding: 28px 36px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-shrink: 0;
}

.drawer-title-area {}
.drawer-label {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.drawer-title {
  font-family: 'Crimson Pro', serif;
  font-size: 26px;
  font-weight: 300;
  color: var(--text);
}

.drawer-title span { color: var(--accent3); }

.drawer-count {
  font-family: 'Space Mono', monospace;
  font-size: 28px;
  color: var(--muted2);
  font-weight: 700;
  line-height: 1;
}

.drawer-count span {
  font-size: 11px;
  color: var(--muted2);
  letter-spacing: 0.2em;
  display: block;
  text-align: right;
  margin-top: 4px;
}

/* Cards */
.cards-area {
  flex: 1;
  overflow-y: auto;
  padding: 28px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cards-area::-webkit-scrollbar { width: 4px; }
.cards-area::-webkit-scrollbar-track { background: transparent; }
.cards-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  color: var(--muted2);
  text-align: center;
}

.empty-icon {
  font-size: 48px;
  opacity: 0.3;
}

.empty-text {
  font-family: 'Crimson Pro', serif;
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  line-height: 1.6;
  max-width: 280px;
}

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px 22px;
  position: relative;
  cursor: default;
  transition: border-color 0.3s, transform 0.2s;
  animation: cardIn 0.4s ease;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateX(16px); }
  to { opacity: 1; transform: translateX(0); }
}

.card:hover {
  border-color: var(--border2);
  transform: translateY(-1px);
}

.card-accent {
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
  background: var(--accent3);
  opacity: 0.6;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  gap: 12px;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
}

.card-tag {
  background: var(--surface2);
  border: 1px solid var(--border2);
  padding: 3px 10px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.08em;
}

.card-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.card-action-btn {
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  transition: color 0.2s;
  line-height: 1;
}

.card-action-btn:hover { color: var(--danger); }
.card-action-btn.expand:hover { color: var(--accent); }

.card-summary {
  font-family: 'Crimson Pro', serif;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 10px;
}

.card-detail {
  font-size: 13px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--text2);
  display: none;
}

.card.expanded .card-detail { display: block; }

.card-footer {
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-time {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  letter-spacing: 0.1em;
}

.card-status {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent3);
}

/* Push notification */
.push-notification {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--surface2);
  border: 1px solid var(--accent);
  padding: 14px 24px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 0.1em;
  z-index: 999;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
}

.push-notification.show {
  transform: translateX(-50%) translateY(0);
}

/* API key modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  padding: 40px;
  max-width: 480px;
  width: 90%;
}

.modal h2 {
  font-family: 'Crimson Pro', serif;
  font-size: 24px;
  font-weight: 300;
  margin-bottom: 12px;
  color: var(--text);
}

.modal p {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.7;
  margin-bottom: 24px;
  font-weight: 300;
}

.modal-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  padding: 14px 16px;
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.3s;
}

.modal-input:focus { border-color: var(--accent); }

.modal-btn {
  background: var(--accent);
  border: none;
  color: var(--bg);
  padding: 14px 28px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  cursor: pointer;
  width: 100%;
  text-transform: uppercase;
  transition: opacity 0.2s;
}

.modal-btn:hover { opacity: 0.85; }

.modal-note {
  margin-top: 12px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  text-align: center;
  line-height: 1.6;
}

@media (max-width: 768px) {
  .app { flex-direction: column; }
  .chat-panel, .drawer-panel { width: 100%; height: 50vh; }
  .chat-panel { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>



<!-- Push notification -->
<div class="push-notification" id="pushNotif">
  ✦ 你在想什么？说出来。
</div>

<div class="app">

  <!-- LEFT: Chat Panel -->
  <div class="chat-panel">
    <div class="chat-header">
      <div>
        <div class="app-name">抽屉 · Drawer</div>
        <div class="chat-title">和<span>它</span>说话</div>
      </div>
      <button class="push-btn" id="pushToggle" onclick="togglePush()">
        <span class="push-dot"></span>
        <span id="pushBtnText">开启提醒</span>
      </button>
    </div>

    <div class="messages" id="messages">
      <div class="message ai">
        <div class="msg-label">抽屉</div>
        <div class="msg-bubble">
          你好。今天脑子里有什么东西在转？<br><br>
          不用想清楚再说。随便说，哪怕一个词，一个感觉。<strong>说出来就对了。</strong>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-row">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="随便说……"
          rows="1"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>

  <!-- RIGHT: Drawer Panel -->
  <div class="drawer-panel">
    <div class="drawer-header">
      <div class="drawer-title-area">
        <div class="drawer-label">我的想法</div>
        <div class="drawer-title">打开<span>抽屉</span></div>
      </div>
      <div class="drawer-count">
        <span id="cardCount">0</span>
        <span>个想法</span>
      </div>
    </div>

    <div class="cards-area" id="cardsArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">◻</div>
        <div class="empty-text">和它聊够了，<br>把好的东西钉进来。<br>打开抽屉，被自己美到。</div>
      </div>
    </div>
  </div>

</div>

<script>
// ─── State ───────────────────────────────────────────
let cards = JSON.parse(localStorage.getItem('drawer_cards') || '[]');
let conversationHistory = [];
let isLoading = false;
let pushInterval = null;
let pushEnabled = false;

// ─── Init ─────────────────────────────────────────────
window.addEventListener('load', () => {
  renderCards();
  autoResizeTextarea();
});

// ─── Auto resize textarea ─────────────────────────────
function autoResizeTextarea() {
  const ta = document.getElementById('chatInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

// ─── Send message ─────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;
  input.value = '';
  input.style.height = 'auto';

  appendMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  setLoading(true);
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `你是"抽屉"，一个帮用户捕捉和深化想法的AI伙伴。

你的风格：
- 简洁，不啰嗦，每次回复100-200字左右
- 像一个真正在听、真正在想的朋友
- 追问要精准，戳到点子上，不要泛泛而问
- 偶尔反将一军，说出用户自己都没意识到的东西
- 中文，口语化，有温度但不腻

你的任务：
1. 先理解用户说的是什么
2. 找到最有意思/最值得深挖的那一个点
3. 用一个好问题把他推得更深
4. 如果用户的想法已经足够清晰，告诉他"这个可以钉进抽屉了"

不要给建议列表，不要说教，不要总结。就是追问、挖深、陪他想。`,
        messages: conversationHistory
      })
    });

    removeTyping();

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || '请求失败');
    }

    const data = await response.json();
    const aiText = data.content.map(b => b.text || '').join('');

    conversationHistory.push({ role: 'assistant', content: aiText });

    const msgIndex = appendAiMessage(aiText);
    currentAiMessageIndex = msgIndex;

  } catch (err) {
    removeTyping();
    appendMessage('ai', `出了点问题：${err.message}。检查一下 API Key 是否有效？`);
  } finally {
    setLoading(false);
  }
}

// ─── DOM helpers ──────────────────────────────────────
function appendMessage(role, text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const label = role === 'user' ? '你' : '抽屉';
  div.innerHTML = `
    <div class="msg-label">${label}</div>
    <div class="msg-bubble">${formatText(text)}</div>
  `;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function appendAiMessage(text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ai';

  const shouldShowSave = conversationHistory.length >= 4;
  const saveHtml = shouldShowSave ? `
    <div class="save-prompt">
      <button class="save-to-drawer" onclick="saveToDrawer(this)">✦ 钉进抽屉</button>
    </div>
  ` : '';

  div.innerHTML = `
    <div class="msg-label">抽屉</div>
    <div class="msg-bubble">${formatText(text)}</div>
    ${saveHtml}
  `;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

let typingEl = null;
function showTyping() {
  const messages = document.getElementById('messages');
  typingEl = document.createElement('div');
  typingEl.className = 'message ai';
  typingEl.innerHTML = `
    <div class="msg-label">抽屉</div>
    <div class="typing-indicator">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  `;
  messages.appendChild(typingEl);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function setLoading(v) {
  isLoading = v;
  document.getElementById('sendBtn').disabled = v;
  document.getElementById('chatInput').disabled = v;
}

// ─── Save to drawer ───────────────────────────────────
async function saveToDrawer(btn) {
  btn.disabled = true;
  btn.textContent = '提炼中…';

  const recent = conversationHistory.slice(-6);
  const contextText = recent.map(m => `${m.role === 'user' ? '用户' : 'AI'}: ${m.content}`).join('\n');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        system: `从对话中提炼核心想法，返回JSON格式，不要任何markdown包裹：
{
  "summary": "一句话，20字以内，点睛之笔，用第一人称，像日记开头",
  "detail": "展开说明，50-80字，保留思考的质感和原话的味道",
  "tags": ["关键词1", "关键词2", "关键词3"]
}`,
        messages: [{ role: 'user', content: `请提炼这段对话的核心想法：\n\n${contextText}` }]
      })
    });

    const data = await response.json();
    const raw = data.content.map(b => b.text || '').join('').replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);

    const card = {
      id: Date.now(),
      summary: parsed.summary,
      detail: parsed.detail,
      tags: parsed.tags || [],
      time: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
      timestamp: Date.now()
    };

    cards.unshift(card);
    localStorage.setItem('drawer_cards', JSON.stringify(cards));
    renderCards();

    btn.textContent = '✓ 已钉入';
    btn.style.borderColor = 'var(--accent3)';
    btn.style.color = 'var(--accent3)';

  } catch (err) {
    btn.disabled = false;
    btn.textContent = '✦ 钉进抽屉';
    alert('提炼失败，请重试');
  }
}

// ─── Render cards ─────────────────────────────────────
function renderCards() {
  const area = document.getElementById('cardsArea');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('cardCount');

  count.textContent = cards.length;

  if (cards.length === 0) {
    empty.style.display = 'flex';
    // Remove all cards
    [...area.querySelectorAll('.card')].forEach(c => c.remove());
    return;
  }

  empty.style.display = 'none';
  area.innerHTML = '';
  area.appendChild(document.getElementById('emptyState') || createEmptyState());

  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card';
    div.id = `card-${card.id}`;

    div.innerHTML = `
      <div class="card-accent"></div>
      <div class="card-header">
        <div class="card-tags">
          ${card.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
        </div>
        <div class="card-actions">
          <button class="card-action-btn expand" onclick="toggleCard(${card.id})" title="展开">⊕</button>
          <button class="card-action-btn" onclick="deleteCard(${card.id})" title="删除">×</button>
        </div>
      </div>
      <div class="card-summary">${card.summary}</div>
      <div class="card-detail">${card.detail}</div>
      <div class="card-footer">
        <div class="card-time">${card.time}</div>
        <div class="card-status"><span class="status-dot"></span>已钉入</div>
      </div>
    `;

    area.appendChild(div);
  });
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.toggle('expanded');
}

function deleteCard(id) {
  cards = cards.filter(c => c.id !== id);
  localStorage.setItem('drawer_cards', JSON.stringify(cards));
  renderCards();
}

// ─── Push reminder ────────────────────────────────────
const pushMessages = [
  '✦ 你在想什么？说出来。',
  '✦ 今天脑子里转了什么？',
  '✦ 有什么没说完的吗？',
  '✦ 抽屉在等你。',
  '✦ 那个爽感还在吗？快说。',
];

function togglePush() {
  pushEnabled = !pushEnabled;
  const btn = document.getElementById('pushToggle');
  const text = document.getElementById('pushBtnText');

  if (pushEnabled) {
    btn.classList.add('active');
    text.textContent = '提醒中…';
    // Request notification permission
    if ('Notification' in window) {
      Notification.requestPermission();
    }
    // Show in-app push every 30 mins
    pushInterval = setInterval(showPushNotif, 30 * 60 * 1000);
    // Show immediately as confirmation
    showPushNotif('✦ 提醒已开启，每30分钟来敲你一次。');
  } else {
    btn.classList.remove('active');
    text.textContent = '开启提醒';
    clearInterval(pushInterval);
    pushInterval = null;
  }
}

function showPushNotif(customMsg) {
  const notif = document.getElementById('pushNotif');
  notif.textContent = customMsg || pushMessages[Math.floor(Math.random() * pushMessages.length)];
  notif.classList.add('show');
  setTimeout(() => notif.classList.remove('show'), 4000);

  // Also try browser notification
  if (!customMsg && 'Notification' in window && Notification.permission === 'granted') {
    new Notification('抽屉', {
      body: '你在想什么？来说出来。',
      icon: '📦'
    });
  }
}

function createEmptyState() {
  const div = document.createElement('div');
  div.id = 'emptyState';
  div.className = 'empty-state';
  div.innerHTML = `
    <div class="empty-icon">◻</div>
    <div class="empty-text">和它聊够了，<br>把好的东西钉进来。<br>打开抽屉，被自己美到。</div>
  `;
  return div;
}
